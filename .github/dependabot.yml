version: 2
updates:
  # - package-ecosystem: "npm"
  #   directories:
  #     - "/"
  #   exclude-paths:
  #     - "submodules/**"
  #   schedule:
  #     interval: "monthly"
  #   open-pull-requests-limit: 5
  #   registries:
